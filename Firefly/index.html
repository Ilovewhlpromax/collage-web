<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏展览</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎨 我的收藏展览</h1>
        <p>记录生活中的美好瞬间</p>
    </header>

    <main>
        <div class="add-section">
            <h2>添加新收藏</h2>
            <form id="addForm">
                <div class="form-group">
                    <label for="name">名称</label>
                    <input type="text" id="name" placeholder="输入收藏名称" required>
                </div>
                <div class="form-group">
                    <label for="description">描述</label>
                    <textarea id="description" placeholder="输入收藏描述" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="image">图片URL</label>
                    <input type="url" id="image" placeholder="输入图片链接">
                </div>
                <div class="form-group">
                    <label for="category">分类</label>
                    <select id="category">
                        <option value="art">艺术品</option>
                        <option value="book">书籍</option>
                        <option value="travel">旅行</option>
                        <option value="music">音乐</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <button type="submit">添加收藏</button>
            </form>
        </div>

        <div class="filter-section">
            <h2>筛选收藏</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="art">艺术品</button>
                <button class="filter-btn" data-category="book">书籍</button>
                <button class="filter-btn" data-category="travel">旅行</button>
                <button class="filter-btn" data-category="music">音乐</button>
                <button class="filter-btn" data-category="other">其他</button>
            </div>
        </div>

        <div class="collection-grid" id="collectionGrid">
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📭</div>
            <h3>暂无收藏</h3>
            <p>添加您的第一个收藏吧！</p>
        </div>
    </main>

    <footer>
        <p>© 2024 我的收藏展览 | 使用 localStorage 本地存储</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
